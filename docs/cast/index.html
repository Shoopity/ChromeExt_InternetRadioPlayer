<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cast Radio</title>
  <style>
    body { max-width: 560px; margin: 48px auto; padding: 0 20px; font: 16px/1.5 sans-serif; color: #202124; }
    h1 { font-size: 24px; }
    #station { overflow-wrap: anywhere; color: #444; }
    #status { min-height: 1.5em; color: #444; }
    google-cast-launcher { display: block; width: 64px; height: 64px; margin: 20px 0; cursor: pointer; }
    #castHelp { padding: 10px 12px; border: 1px solid #d7dfdc; border-radius: 6px; background: #f3f8f5; color: #444; font-size: 14px; }
    #castHelp strong { color: #222; }
  </style>
  <script>
    window.__onGCastApiAvailable = (available) => {
      window.castApiAvailable = available;
      window.dispatchEvent(new Event('cast-api-available'));
    };
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>
  <main>
    <h1>Cast radio to a speaker</h1>
    <p id="station"></p>
    <p>Choose a Google Cast speaker using the button below. The tab may be closed after casting starts.</p>
    <google-cast-launcher aria-label="Choose a Google Cast speaker"></google-cast-launcher>
    <p id="castHelp" hidden>
      <strong>Control your cast:</strong> select Chrome's <strong>Control your music, video, and more</strong> icon in the upper-right toolbar.
    </p>
    <p id="status" role="status" aria-live="polite">Connecting to Google Cast…</p>
  </main>
  <script src="./cast.js"></script>
</body>
</html>
