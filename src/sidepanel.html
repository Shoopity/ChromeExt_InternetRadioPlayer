<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Radio Player</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 12px;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
    }
    h2, h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }
    .section {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #ccc;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    input {
      padding: 6px;
      font-size: 14px;
    }
    button {
      padding: 6px 12px;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .station-name, .search-item-name {
      cursor: pointer;
      flex-grow: 1;
      margin-right: 8px;
    }
    .del-btn {
      color: red;
      border: none;
      background: none;
      font-weight: bold;
    }
    li { gap: 6px; }
    .station-name, .search-item-name { overflow-wrap: anywhere; min-width: 0; }
    .play-btn { flex-shrink: 0; }
    .episode-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .episode-details { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 3px; }
    .episode-date, #feedStatus { color: #555; font-size: 12px; margin: 4px 0 0; }
    #episodeList li { gap: 10px; }
    .is-playing { background: #edf8f0; }
    .is-loading { background: #fff8e6; }
    .playback-section {
      height: 150px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .playback-details {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .playback-status {
      font-size: 14px;
      overflow-wrap: anywhere;
      margin: 0;
    }
    .now-playing { margin: 8px 0 0; font-size: 13px; overflow-wrap: anywhere; color: #444; }
    #stopBtn { align-self: flex-start; flex-shrink: 0; }
    #stopBtn[hidden] { display: inline-block !important; visibility: hidden; }
    .equalizer {
      display: inline-flex; align-items: flex-end; gap: 2px;
      height: 20px; width: 18px; flex-shrink: 0;
    }
    [hidden] { display: none !important; }
    .equalizer i {
      display: block; width: 3px; height: 100%; background: #16813e;
      transform-origin: bottom; animation: equalize 850ms ease-in-out infinite alternate;
    }
    .equalizer i:nth-child(2) { animation-delay: -320ms; animation-duration: 640ms; }
    .equalizer i:nth-child(3) { animation-delay: -560ms; animation-duration: 970ms; }
    .equalizer i:nth-child(4) { animation-delay: -180ms; animation-duration: 730ms; }
    @keyframes equalize { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .equalizer i { animation: none; transform: scaleY(.65); } }
  </style>
</head>
<body>

  <div class="section playback-section">
    <div class="playback-details">
      <p id="playbackStatus" class="playback-status" role="status">No station playing</p>
      <p id="nowPlaying" class="now-playing" role="status"></p>
    </div>
    <button id="stopBtn" hidden>■ Stop playback</button>
  </div>

  <!-- Section 1: Search Online Radio API -->
  <div class="section">
    <h3>Search Radio Stations</h3>
    <div class="input-group">
      <input type="text" id="searchInput" placeholder="Search by station name..." />
      <button id="searchBtn">Search</button>
    </div>
    <ul id="searchResults"></ul>
  </div>

  <div class="section">
    <h3>Podcast Feed</h3>
    <div class="input-group">
      <input type="url" id="feedUrlInput" placeholder="RSS feed URL" />
      <button id="loadFeedBtn">Load Feed</button>
      <label for="episodeOrder">Play order</label>
      <select id="episodeOrder">
        <option value="oldest">Oldest to newest</option>
        <option value="newest">Newest to oldest</option>
      </select>
      <button id="resumePodcastBtn" hidden></button>
      <div class="feed-actions">
        <button type="button" id="toggleEpisodeListBtn" aria-expanded="false">Show episodes</button>
        <button type="button" id="clearFeedBtn">Clear feed</button>
      </div>
    </div>
    <p id="feedStatus" role="status"></p>
    <ul id="episodeList" hidden></ul>
  </div>

  <!-- Section 2: Add Custom Station Stream URL -->
  <div class="section">
    <h3>Add Custom Station</h3>
    <div class="input-group">
      <input type="text" id="nameInput" placeholder="Station Name" />
      <input type="text" id="urlInput" placeholder="Stream URL (http://...)" />
      <button id="addBtn">Add Station</button>
    </div>
  </div>

  <!-- Section 3: Saved / Synced Stations -->
  <div class="section">
    <h3>My Stations</h3>
    <ul id="stationList"></ul>
  </div>

  <script src="metadata.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
