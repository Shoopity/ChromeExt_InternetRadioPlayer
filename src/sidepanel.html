<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Radio Player</title>
  <style>
    body { font-family: sans-serif; padding: 12px; margin: 0; width: 100%; box-sizing: border-box; }
    h2, h3 { margin-top: 0; margin-bottom: 8px; }
    h4 { margin: 0 0 8px; }
    .section { margin-bottom: 16px; padding: 14px; border: 1px solid #d7dfdc; border-left: 4px solid #16813e; border-radius: 6px; background: #f3f8f5; }
    .section[data-section-id="tools"] { border-color: #d8dce8; border-left-color: #4f628f; background: #f5f6fa; }
    .section[data-section-id="stations"] { border-color: #e8deca; border-left-color: #b77a23; background: #fff9ef; }
    #sectionContainer { display: flex; flex-direction: column; }
    .section-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .section-header h3, .section-header h4 { margin: 0; }
    .section-actions, .feed-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .section-actions button, .feed-actions button { padding: 4px 8px; }
    .tool-subsection { margin-top: 12px; padding: 10px; border: 1px solid #dfe2e9; border-radius: 4px; background: #fff; }
    .tool-subsection h4 { color: #34425f; }
    #searchSectionTitle { color: #243a71; }
    #podcastSectionTitle { color: #7d561c; }
    #customStationTitle { color: #286447; }
    .subsection-heading { margin: 16px 0 6px; padding-top: 12px; border-top: 1px solid #e8deca; color: #79531e; }
    .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    input { padding: 6px; font-size: 14px; }
    button { padding: 6px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 0; border-bottom: 1px solid #eee; }
    .station-name, .search-item-name { cursor: pointer; flex-grow: 1; margin-right: 8px; overflow-wrap: anywhere; min-width: 0; }
    .del-btn { color: red; border: none; background: none; font-weight: bold; }
    .play-btn { flex-shrink: 0; }
    .episode-title { flex: 1; min-width: 0; overflow-wrap: anywhere; text-align: left; }
    .episode-details { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 3px; }
    .saved-feed-row { display: block; }
    .saved-feed-controls { display: flex; align-items: center; gap: 6px; }
    .saved-feed-controls .episode-title { text-align: left; }
    #episodeList { margin-top: 6px; padding-left: 10px; border-left: 2px solid #dfe2e9; }
    .episode-date, #feedStatus, #syncStatus { color: #555; font-size: 12px; margin: 4px 0 0; overflow-wrap: anywhere; }
    #episodeList li { gap: 10px; }
    .is-playing { background: #edf8f0; }
    .is-loading { background: #fff8e6; }
    .section[data-section-id="playback"] { box-sizing: border-box; height: 244px; min-height: 244px; max-height: 244px; flex: 0 0 244px; overflow: visible; }
    .section[data-section-id="playback"] > .section-header { height: 26px; }
    .playback-section { box-sizing: border-box; height: calc(100% - 36px); display: grid; grid-template-rows: 40px 64px 24px 30px; gap: 6px; margin-top: 10px; }
    .playback-summary, .playback-heading { display: flex; align-items: flex-start; min-width: 0; }
    .playback-heading { width: 100%; gap: 8px; }
    .playback-hover-text { position: relative; flex: 1; min-width: 0; outline-offset: 2px; }
    .playback-status, .now-playing { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; line-height: 20px; max-height: 40px; margin: 0; }
    .playback-status { font-size: 14px; }
    .now-playing { font-size: 13px; color: #444; }
    .playback-full-text { display: none; position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; width: max-content; max-width: min(440px, calc(100vw - 48px)); max-height: 60vh; overflow: auto; padding: 8px; border: 1px solid #87918d; border-radius: 4px; background: #fff; box-shadow: 0 3px 10px #0003; color: #222; font-size: 13px; line-height: 1.4; white-space: normal; overflow-wrap: anywhere; user-select: text; }
    .playback-hover-text:hover .playback-full-text, .playback-hover-text:focus .playback-full-text { display: block; }
    .playback-media { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 0; }
    .playback-actions, .seek-buttons { display: flex; align-items: center; gap: 6px; }
    .playback-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 30px; }
    .playback-actions > button, .playback-primary > button { box-sizing: border-box; width: 100%; min-width: 0; height: 30px; padding: 5px 2px; font-size: 12px; white-space: nowrap; }
    .playback-primary { display: grid; min-width: 0; }
    .playback-primary > button { grid-area: 1 / 1; }
    .volume-controls { display: flex; align-items: center; gap: 8px; min-width: 0; color: #444; font-size: 12px; }
    .volume-controls input { flex: 1; min-width: 0; padding: 0; }
    .volume-controls output { width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
    .seek-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; }
    .seek-slider-wrap { position: relative; grid-column: 1; min-width: 0; padding-top: 24px; }
    .seek-controls input { width: 100%; min-width: 0; padding: 0; }
    .seek-preview { position: absolute; top: 0; left: 5%; transform: translateX(-50%); padding: 3px 6px; border-radius: 3px; background: #34425f; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; }
    .seek-times { display: flex; justify-content: space-between; grid-column: 1 / -1; color: #555; font-size: 12px; font-variant-numeric: tabular-nums; }
    #seekUnavailable { margin: 0; color: #555; font-size: 12px; }
    .playback-actions button, .seek-buttons button { flex-shrink: 0; }
    .equalizer { display: inline-flex; align-items: flex-end; gap: 2px; height: 20px; width: 18px; flex-shrink: 0; }
    [hidden] { display: none !important; }
    .equalizer i { display: block; width: 3px; height: 100%; background: #16813e; transform-origin: bottom; animation: equalize 850ms ease-in-out infinite alternate; }
    .equalizer i:nth-child(2) { animation-delay: -320ms; animation-duration: 640ms; }
    .equalizer i:nth-child(3) { animation-delay: -560ms; animation-duration: 970ms; }
    .equalizer i:nth-child(4) { animation-delay: -180ms; animation-duration: 730ms; }
    @keyframes equalize { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .equalizer i { animation: none; transform: scaleY(.65); } }
  </style>
</head>
<body>
  <main id="sectionContainer">
    <section class="section top-section" data-section-id="playback">
      <header class="section-header">
        <h3>Now Playing</h3>
        <div class="section-actions">
          <button type="button" data-move="up" aria-label="Move Now Playing section up" title="Move up">↑</button>
          <button type="button" data-move="down" aria-label="Move Now Playing section down" title="Move down">↓</button>
        </div>
      </header>
      <div class="playback-section">
        <div class="playback-summary">
          <div class="playback-heading">
            <span id="playbackEqualizer" class="equalizer" hidden aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </span>
            <div class="playback-hover-text" tabindex="0">
              <p id="playbackStatus" class="playback-status" role="status">No station playing</p>
              <span id="playbackStatusFull" class="playback-full-text" role="tooltip"></span>
            </div>
          </div>
        </div>
        <div class="playback-media">
          <div id="nowPlayingDetails" class="playback-hover-text" tabindex="0">
            <p id="nowPlaying" class="now-playing" role="status"></p>
            <span id="nowPlayingFull" class="playback-full-text" role="tooltip"></span>
          </div>
          <div id="seekControls" hidden>
            <div class="seek-controls">
              <div class="seek-slider-wrap">
                <output id="seekPreview" class="seek-preview" hidden></output>
                <input id="playbackSeek" type="range" min="0" max="100" step="1" value="0" aria-label="Playback position">
              </div>
              <div class="seek-buttons">
                <button id="back10Btn" type="button" aria-label="Back 10 seconds" title="Back 10 seconds">-10s</button>
                <button id="forward10Btn" type="button" aria-label="Forward 10 seconds" title="Forward 10 seconds">+10s</button>
              </div>
              <div class="seek-times"><span id="playbackCurrentTime">0:00</span><span id="playbackDuration">0:00</span></div>
            </div>
            <p id="seekUnavailable" hidden>Seeking not possible with this stream</p>
          </div>
        </div>
        <label class="volume-controls" for="playbackVolume">
          <span>Volume</span>
          <input id="playbackVolume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
          <output id="playbackVolumeValue" for="playbackVolume">100%</output>
        </label>
        <div class="playback-actions">
          <button id="previousEpisodeBtn" type="button" aria-label="Play previous podcast episode" title="Previous episode" disabled>|◀ Previous</button>
          <button id="nextEpisodeBtn" type="button" aria-label="Play next podcast episode" title="Next episode" disabled>Next ▶|</button>
          <div class="playback-primary">
            <button id="resumeBtn" type="button" aria-hidden="true" disabled style="visibility: hidden">▶ Resume</button>
            <button id="pauseBtn" type="button" aria-hidden="true" disabled style="visibility: hidden">Ⅱ Pause</button>
            <button id="stopBtn" type="button" aria-hidden="true" disabled style="visibility: hidden">■ Stop</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section top-section" data-section-id="tools">
      <header class="section-header">
        <h3>Search &amp; Add Stations</h3>
        <div class="section-actions">
          <button type="button" id="toggleToolsBtn" aria-expanded="true">Collapse</button>
          <button type="button" data-move="up" aria-label="Move Search and Add section up" title="Move up">↑</button>
          <button type="button" data-move="down" aria-label="Move Search and Add section down" title="Move down">↓</button>
        </div>
      </header>
      <div id="toolsContent">
        <section class="tool-subsection" aria-labelledby="searchSectionTitle">
          <header class="section-header">
            <h4 id="searchSectionTitle">Search Radio Stations</h4>
            <button type="button" id="toggleSearchBtn" aria-expanded="true">Collapse</button>
          </header>
          <div id="searchContent">
            <div class="input-group">
              <label for="radioSearchServer">Station directory</label>
              <select id="radioSearchServer">
                <option value="https://all.api.radio-browser.info">Radio Browser (automatic)</option>
                <option value="https://de1.api.radio-browser.info">Radio Browser (direct server)</option>
              </select>
              <input type="text" id="searchInput" placeholder="Search by station name..." />
              <button id="searchBtn">Search</button>
            </div>
            <ul id="searchResults"></ul>
          </div>
        </section>

        <section class="tool-subsection" aria-labelledby="podcastSectionTitle">
          <h4 id="podcastSectionTitle">Podcast Feed</h4>
          <div class="input-group">
            <input type="url" id="feedUrlInput" placeholder="RSS feed URL" />
            <button id="loadFeedBtn">Search Feed</button>
            <button id="saveFeedBtn" hidden>Save Feed</button>
            <label for="episodeOrder">Play order</label>
            <select id="episodeOrder">
              <option value="oldest">Oldest to newest</option>
              <option value="newest">Newest to oldest</option>
            </select>
            <button id="resumePodcastBtn" hidden></button>
            <button type="button" id="clearFeedBtn">Clear feed</button>
          </div>
          <p id="feedStatus" role="status"></p>
          <div id="feedResultsHome">
            <div id="feedResultsPanel">
              <div class="feed-actions">
                <button type="button" id="toggleEpisodeListBtn" aria-expanded="false">Show episodes</button>
              </div>
              <ul id="episodeList" hidden></ul>
            </div>
          </div>
        </section>

        <section class="tool-subsection" aria-labelledby="customStationTitle">
          <h4 id="customStationTitle">Add Custom Station</h4>
          <div class="input-group">
            <input type="text" id="nameInput" placeholder="Station Name" />
            <input type="text" id="urlInput" placeholder="Stream URL (http://...)" />
            <button id="addBtn">Add Station</button>
          </div>
        </section>
      </div>
    </section>

    <section class="section top-section" data-section-id="stations">
      <header class="section-header">
        <h3>My Stations</h3>
        <div class="section-actions">
          <button type="button" data-move="up" aria-label="Move My Stations section up" title="Move up">↑</button>
          <button type="button" data-move="down" aria-label="Move My Stations section down" title="Move down">↓</button>
        </div>
      </header>
      <p id="syncStatus" role="status">Checking Chrome Sync…</p>
      <ul id="stationList"></ul>
      <h4 class="subsection-heading">Saved Feeds</h4>
      <ul id="savedFeedList"></ul>
    </section>
  </main>
  <script src="metadata.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
